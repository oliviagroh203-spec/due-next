      const tests = [];
      const test = (name, body) => tests.push({ name, body });
      const assertEqual = (actual, expected) => {
        const a = JSON.stringify(actual);
        const e = JSON.stringify(expected);
        if (a !== e) throw new Error(`expected ${e}, got ${a}`);
      };

      class MemoryStorage {
        #data = new Map();
        getItem(key) {
          return this.#data.has(key) ? this.#data.get(key) : null;
        }
        setItem(key, value) {
          this.#data.set(key, String(value));
        }
      }

      const today = "2026-10-13";
      const task = (name, due, done = false, time = "") => ({
        id: name,
        name,
        course: "",
        due,
        time,
        done,
        reminders: [],
        repeat: "none",
        estimateMinutes: 0,
        groupId: "",
        customColor: null,
        steps: [],
        notes: "",
        pinned: false,
        weight: null,
      });

      test("tasks are sorted into overdue, today, this week, later, and done", () => {
        const groups = groupTasks(
          [
            task("later", "2026-11-01"),
            task("week", "2026-10-20"),
            task("today", "2026-10-13"),
            task("overdue", "2026-10-10"),
            task("finished", "2026-10-01", true),
          ],
          today,
        );
        assertEqual(groups.overdue.map((t) => t.name), ["overdue"]);
        assertEqual(groups.today.map((t) => t.name), ["today"]);
        assertEqual(groups.week.map((t) => t.name), ["week"]);
        assertEqual(groups.later.map((t) => t.name), ["later"]);
        assertEqual(groups.done.map((t) => t.name), ["finished"]);
      });

      test("tasks within a group are ordered by due date", () => {
        const groups = groupTasks([task("b", "2026-10-18"), task("a", "2026-10-15")], today);
        assertEqual(groups.week.map((t) => t.name), ["a", "b"]);
      });

      test("exactly seven days away counts as this week; eight is later", () => {
        assertEqual(urgencyOf(task("x", "2026-10-20"), today), "week");
        assertEqual(urgencyOf(task("x", "2026-10-21"), today), "later");
      });

      test("a blank name is rejected", () => {
        assertEqual(validateTask({ name: "   ", due: today }), "Give the task a name.");
      });

      test("a missing due date is rejected", () => {
        assertEqual(validateTask({ name: "MP2", due: "" }), "Pick a due date.");
      });

      test("a valid task passes validation and is trimmed", () => {
        assertEqual(validateTask({ name: "MP2", due: today }), null);
        const created = createTask({ name: "  MP2  ", course: " CS 124 ", due: today });
        assertEqual([created.name, created.course, created.done], ["MP2", "CS 124", false]);
      });

      test("saved tasks come back after a reload", () => {
        const storage = new MemoryStorage();
        const saved = [task("MP2", today), task("Quiz", "2026-10-15", true)];
        saveTasks(storage, saved);
        assertEqual(loadTasks(storage), saved);
      });

      test("a big task's steps save, sort by day, and show progress", () => {
        const storage = new MemoryStorage();
        const paper = createTask({
          name: "Paper 2",
          course: "RHET 105",
          due: "2026-12-04",
          steps: [
            { id: "s3", name: " Edit ", date: "2026-12-03", done: false },
            { id: "s1", name: "Outline", date: "2026-11-30", done: true },
            { id: "s2", name: "Draft", date: "2026-12-01" },
          ],
        });
        assertEqual(paper.steps.map((step) => [step.name, step.date, step.done]), [
          ["Outline", "2026-11-30", true],
          ["Draft", "2026-12-01", false],
          ["Edit", "2026-12-03", false],
        ]);
        assertEqual(stepProgress(paper), "1 of 3 steps");
        assertEqual(stepProgress(createTask({ name: "Quiz", due: "2026-12-04" })), "");
        saveTasks(storage, [paper]);
        assertEqual(loadTasks(storage)[0].steps, paper.steps);
        // Tasks saved before steps existed load with none.
        storage.setItem(STORAGE_KEY, JSON.stringify([task("Old", "2026-12-01")].map(({ steps, ...old }) => old)));
        assertEqual(loadTasks(storage)[0].steps, []);
        assertEqual(cleanSteps("junk"), []);
      });

      test("steps need a name and a day no later than the due date", () => {
        const step = (name, date) => ({ id: name || "x", name, date, done: false });
        assertEqual(stepsError([step("Outline", "2026-11-30")], "2026-12-04"), null);
        assertEqual(stepsError([step("Outline", "2026-12-04")], "2026-12-04"), null);
        assertEqual(stepsError([step("  ", "2026-11-30")], "2026-12-04"), "Give each step a name, or remove it with ×.");
        assertEqual(stepsError([step("Outline", "")], "2026-12-04"), "Pick a day for each step.");
        assertEqual(stepsError([step("Outline", "2026-12-05")], "2026-12-04"), "Each step's day should be on or before the due date.");
      });

        assertEqual(stepsToDo([paper, finished], "2026-12-02").map(({ step }) => step.name), ["Draft"]);
        assertEqual(stepsToDo([paper], "2026-12-03").map(({ step }) => step.name), ["Draft", "Edit"]);

      test("a new step's day follows the last one, never past the due date", () => {
        assertEqual(nextStepDate([], "2026-12-04", "2026-11-28"), "2026-11-28");

      test("suggested steps fit the kind of work and spread out before the due date", () => {
        const today = "2026-11-21";
        const suggest = (name, due, estimateMinutes = 0) => suggestSteps({ name, due, estimateMinutes }, today);
        assertEqual(suggest("Paper 2", "2026-11-28"), [
          { name: "Outline", date: "2026-11-21" },
          { name: "Draft", date: "2026-11-24" },
          { name: "Edit", date: "2026-11-27" },
        ]);
        assertEqual(suggest("MATH 220 Midterm 2", "2026-12-01").map((step) => step.name), ["Review notes", "Practice problems", "Practice test"]);
        assertEqual(suggest("Quiz 9", "2026-12-01").map((step) => step.name), ["Review notes", "Practice problems"]);
        assertEqual(suggest("HW10", "2026-12-01").map((step) => step.name), ["Start problems", "Finish problems", "Check answers"]);
        assertEqual(suggest("Group project", "2026-12-01").map((step) => step.name), ["Plan", "Build", "Test"]);
        assertEqual(suggest("Latest reading", "2026-12-01").map((step) => step.name), ["Start", "Keep going", "Finish"]);
        // "Final" means an exam only when nothing else fits.
        assertEqual(suggest("Final project", "2026-12-01").map((step) => step.name), ["Plan", "Build", "Test"]);
        assertEqual(suggest("Final paper", "2026-12-01").map((step) => step.name), ["Outline", "Draft", "Edit"]);
        assertEqual(suggest("CHEM 102 Final", "2026-12-01").map((step) => step.name), ["Review notes", "Practice problems", "Practice test"]);
        // Get ahead starts the week before, not weeks early.
        assertEqual(
          suggestSteps({ name: "Midterm 3", due: "2026-12-10" }, today, { from: "2026-12-03" }).map((step) => step.date),
          ["2026-12-03", "2026-12-06", "2026-12-09"],
        );
        // A 4-hour estimate means starting 2 days before: steps begin then, not today.
        assertEqual(suggest("Essay", "2026-12-10", 240).map((step) => step.date), ["2026-12-08", "2026-12-09", "2026-12-09"]);
        // Due tomorrow: everything today. Due today: everything today.
        assertEqual(suggest("Essay", "2026-11-22").map((step) => step.date), ["2026-11-21", "2026-11-21", "2026-11-21"]);
        assertEqual(suggest("Essay", "2026-11-21").map((step) => step.date), ["2026-11-21", "2026-11-21", "2026-11-21"]);
        // Every suggestion passes the same check as steps typed by hand.
        const steps = suggest("Paper 2", "2026-11-28").map((step, index) => ({ ...step, id: String(index), done: false }));
        assertEqual(stepsError(steps, "2026-11-28"), null);
      });

      test("search finds tasks, steps, and events by any words in the name or class, soonest first", () => {
        const today = "2026-11-21";
        const quiz = { ...task("Quiz 9", "2026-11-24"), course: "MATH 220" };
        const oldQuiz = { ...task("Quiz 8", "2026-11-17", true), course: "MATH 220" };
        const paper = {
          ...task("Paper 2", "2026-12-04"),
          course: "RHET 105",
          steps: [{ id: "s1", name: "Outline", date: "2026-11-30", done: false }],
        };
        const events = [{ id: "e1", name: "MATH 220 review session", date: "2026-11-23", start: "18:00" }];
        const tasks = [quiz, oldQuiz, paper];
        const names = (text) => searchEverything(text, { tasks, events }, today).map((item) => item.name);
        assertEqual(names("math 220"), ["MATH 220 review session", "Quiz 9", "Quiz 8"]);
        assertEqual(names("220 quiz"), ["Quiz 9", "Quiz 8"]);
        assertEqual(names("outline"), ["Outline"]);
        assertEqual(names("rhet"), ["Outline", "Paper 2"]);
        assertEqual(names("  "), []);
        assertEqual(names("chemistry"), []);
        const [step] = searchEverything("outline", { tasks, events }, today);
        assertEqual([step.kind, step.taskId, step.detail, step.date], ["step", "Paper 2", "Paper 2", "2026-11-30"]);
        assertEqual(searchEverything("quiz", { tasks, events }, today, 1).length, 1);
      });

      test("notes keep links clickable and save with the task", () => {
        const notes = "Read ch. 4-6 first. Rubric: https://canvas.illinois.edu/courses/1/assignments/2, and the template (https://docs.example.com/t).";
        assertEqual(notesParts(notes), [
          { text: "Read ch. 4-6 first. Rubric: " },
          { link: "https://canvas.illinois.edu/courses/1/assignments/2" },
          { text: ", and the template (" },
          { link: "https://docs.example.com/t" },
          { text: ")." },
        ]);
        assertEqual(firstLink(notes), "https://canvas.illinois.edu/courses/1/assignments/2");
        assertEqual(firstLink("no links here"), "");
        // Only web links become clickable.
        assertEqual(firstLink("javascript:alert(1) ftp://files.example.com"), "");
        assertEqual(notesParts(""), []);
        const storage = new MemoryStorage();
        const paper = createTask({ name: "Paper 2", due: "2026-12-04", notes: `  ${notes}  ` });
        assertEqual(paper.notes, notes);
        saveTasks(storage, [paper]);
        assertEqual(loadTasks(storage)[0].notes, notes);
        assertEqual(validateTask({ name: "Paper 2", due: "2026-12-04", notes: "x".repeat(1001) }), "Keep notes under 1,000 characters.");
        assertEqual(updateTask(paper, { name: "Paper 2", due: "2026-12-05" }).notes, notes);
        assertEqual(updateTask(paper, { name: "Paper 2", due: "2026-12-05", notes: "" }).notes, "");
      });

      test("the calendar can show just one class or group", () => {
        const groups = [{ id: "school", name: "School", color: 0 }, { id: "work", name: "Work", color: 4 }, { id: "gym", name: "Gym", color: 2 }];
        const quiz = { ...task("Quiz 9", "2026-11-24"), course: "MATH 220", groupId: "school" };
        const hw = { ...task("HW10", "2026-11-25"), course: " math 220 " };
        const paper = { ...task("Paper 2", "2026-12-04"), course: "RHET 105" };
        const shift = { ...task("Shift", "2026-11-24"), groupId: "work" };
        const oldClass = { ...task("Final", "2026-05-01", true), course: "CHEM 102" };
        const review = { id: "e1", name: "Review", course: "MATH 220", groupId: "" };
        const options = filterOptions([quiz, hw, paper, shift, oldClass], [review], groups);
        assertEqual(options.map((option) => option.label), ["MATH 220", "RHET 105", "School", "Work"]);
        const math = options[0];
        assertEqual([quiz, hw, paper, shift].filter((item) => matchesFilter(item, math)).map((item) => item.name), ["Quiz 9", "HW10"]);
        assertEqual(matchesFilter(review, math), true);
        const work = options.find((option) => option.label === "Work");
        assertEqual([quiz, hw, paper, shift].filter((item) => matchesFilter(item, work)).map((item) => item.name), ["Shift"]);
        assertEqual(matchesFilter(paper, null), true);
        assertEqual(matchesFilter({ ...task("No class", "2026-11-24") }, { kind: "course", value: "" }), false);
      });

      test("on Sunday, the first open shows what's due this week", () => {
        const sunday = new Date("2026-11-22T10:00");
        const tasks = [
          { ...task("HW10", "2026-11-25", false, "23:59"), course: "MATH 220" },
          { ...task("Quiz 9", "2026-11-25", false, "10:00"), course: "MATH 220" },
          { ...task("Midterm 2", "2026-11-27"), course: "CHEM 102" },
          { ...task("Paper 2", "2026-11-29"), course: "RHET 105", steps: [{ id: "s", name: "Outline", date: "2026-11-24", done: false }] },
          { ...task("Lab 5", "2026-11-23", true) },
          { ...task("Old", "2026-11-20") },
        ];
        const plan = sundayPlan(tasks, sunday, "");
        assertEqual(plan.due.map((item) => item.name), ["Quiz 9", "HW10", "Midterm 2"]);
        assertEqual(plan.busiest, { date: "2026-11-25", count: 2 });
        assertEqual(plan.big.map((item) => item.name), ["Midterm 2"]);
        assertEqual(plan.steps, 1);
        // Once a Sunday, and only on Sundays.
        assertEqual(sundayPlan(tasks, sunday, "2026-11-22"), null);
        assertEqual(sundayPlan(tasks, new Date("2026-11-23T10:00"), ""), null);
        // A quiet week still gets a card, just with nothing due.
        const quiet = sundayPlan([], sunday, "");
        assertEqual([quiet.due, quiet.busiest, quiet.big, quiet.steps], [[], null, [], 0]);
      });

      test("holidays land on the right days, including the ones that move every year", () => {
        const on = (year) => Object.fromEntries(holidaysIn(year).map((holiday) => [holiday.name, holiday.date]));
        const y2026 = on(2026);
        assertEqual(
          [y2026["Martin Luther King Jr. Day"], y2026["Presidents' Day"], y2026.Easter, y2026["Mother's Day"], y2026["Memorial Day"]],
          ["2026-01-19", "2026-02-16", "2026-04-05", "2026-05-10", "2026-05-25"],
        );
        assertEqual(
          [y2026["Father's Day"], y2026["Labor Day"], y2026["Indigenous Peoples' Day"], y2026.Thanksgiving, y2026.Halloween],
          ["2026-06-21", "2026-09-07", "2026-10-12", "2026-11-26", "2026-10-31"],
        );
        const y2027 = on(2027);
        assertEqual([y2027.Easter, y2027.Thanksgiving, y2027["Memorial Day"]], ["2027-03-28", "2027-11-25", "2027-05-31"]);
        assertEqual(on(2025).Easter, "2025-04-20");
        assertEqual(holidaysOn("2026-11-26").map((holiday) => [holiday.name, holiday.start, holiday.holiday]), [["Thanksgiving", "", true]]);
        assertEqual(holidaysOn("2026-11-27"), []);
      });

      test("a class added once repeats every week on its days, for a semester unless it ends sooner", () => {
        const lecture = { name: "MATH 220 lecture", course: "MATH 220", date: "2026-08-24", start: "10:00", end: "10:50" };
        const mwf = createRepeatingEvents(lecture, { repeats: "weekly", weekdays: [1, 3, 5], until: "2026-09-04" });
        assertEqual(mwf.map((event) => event.date), ["2026-08-24", "2026-08-26", "2026-08-28", "2026-08-31", "2026-09-02", "2026-09-04"]);
        assertEqual(new Set(mwf.map((event) => event.seriesId)).size, 1);
        assertEqual(new Set(mwf.map((event) => event.id)).size, 6);
        assertEqual([mwf[3].start, mwf[3].end, mwf[3].course], ["10:00", "10:50", "MATH 220"]);
        // No end date: 16 weeks of Mondays.
        const mondays = createRepeatingEvents(lecture, { repeats: "weekly", weekdays: [1], until: "" });
        assertEqual([mondays.length, mondays.at(-1).date], [16, "2026-12-07"]);
        assertEqual(EVENT_REPEAT_HORIZON_DAYS, 112);
        assertEqual(createRepeatingEvents(lecture, { repeats: "none" }).map((event) => event.seriesId), [undefined]);
        // Changing one copy keeps it in the series; deleting offers one, this and later, or all.
        assertEqual(updateEvent(mwf[1], { ...lecture, date: "2026-08-26", start: "11:00", end: "11:50" }).seriesId, mwf[0].seriesId);
        const other = createEvent({ name: "Club", date: "2026-08-25", start: "18:00", end: "19:00" });
        const all = [...mwf, other];
        assertEqual(deleteEventFromSeries(all, mwf[2], "one").length, 6);
        assertEqual(deleteEventFromSeries(all, mwf[2], "following").map((event) => event.date), ["2026-08-24", "2026-08-26", "2026-08-25"]);
        assertEqual(deleteEventFromSeries(all, mwf[2], "all").map((event) => event.name), ["Club"]);
      });

      test("dark mode can follow the computer, stay on or off, or come on at night", () => {
        const at = (clock) => new Date(`2026-11-22T${clock}`);
        assertEqual(cleanDarkSetting(null), { mode: "system", from: "20:00", to: "07:00" });
        assertEqual(cleanDarkSetting({ mode: "bogus", from: "25:00", to: "06:30" }), { mode: "system", from: "20:00", to: "06:30" });
        assertEqual([isDarkNow({ mode: "system" }, at("12:00"), true), isDarkNow({ mode: "system" }, at("12:00"), false)], [true, false]);
        assertEqual([isDarkNow({ mode: "on" }, at("12:00"), false), isDarkNow({ mode: "off" }, at("23:00"), true)], [true, false]);
        const night = { mode: "night", from: "20:00", to: "07:00" };
        assertEqual(["19:59", "20:00", "23:30", "00:15", "06:59", "07:00", "12:00"].map((clock) => isDarkNow(night, at(clock), false)), [false, true, true, true, true, false, false]);
        const afternoon = { mode: "night", from: "13:00", to: "17:00" };
        assertEqual(["12:59", "13:00", "16:59", "17:00"].map((clock) => isDarkNow(afternoon, at(clock), false)), [false, true, true, false]);
      });

      test("the finals countdown finds the first final exam and counts down to it", () => {
        const today = "2026-11-22";
        const tasks = [
          { ...task("Final project", "2026-12-04") },
          { ...task("CHEM 102 Final", "2026-12-15") },
          { ...task("MATH 220 Final Exam", "2026-12-11") },
          { ...task("Old final", "2026-05-10") },
          { ...task("Finished final", "2026-12-09", true) },

        assertEqual(newLoginError({ username: "olivia_g", password: "abc" }), "Use at least 6 characters for your password, with an uppercase letter, a number, and a symbol.");
        assertEqual(newLoginError({ username: "olivia_g", password: "Abcdef1" }), "Your password also needs a symbol like ! or #.");
        assertEqual(newLoginError({ username: " Olivia_G ", password: "Abcde1!" }), "");
        assertEqual(normalizeUsername(" Olivia_G "), "olivia_g");
      });

      test("creating an account then asks for an email and a first and last name", () => {
        const name = { firstName: "Olivia", lastName: "Groh" };
        assertEqual(profileError({ email: "", ...name }), "Type your email.");
        assertEqual(profileError({ email: "olivia", ...name }), "That email doesn't look right. It needs an @.");
        assertEqual(profileError({ email: "o@x.com", ...name, firstName: "  " }), "Type your first name.");
        assertEqual(profileError({ email: "o@x.com", ...name, lastName: "" }), "Type your last name.");
        assertEqual(profileError({ email: " o@x.com ", ...name }), "");
      });

      test("signing in on a browser with its own tasks and events keeps both sets", () => {
        const account = {
          "due-tasks-v1": JSON.stringify([{ id: "a", name: "Account copy" }, { id: "b", name: "Only in account" }]),
          "due-groups-v1": JSON.stringify([{ id: "school", name: "School", color: 0 }]),
          [EVENTS_KEY]: JSON.stringify([{ id: "e1", name: "Club" }]),
          "due-theme": "dark",
        };
        const local = {
          "due-tasks-v1": JSON.stringify([{ id: "a", name: "Local copy" }, { id: "c", name: "Only here" }]),
          "due-groups-v1": JSON.stringify([{ id: "school", name: "School", color: 0 }, { id: "gym", name: "Gym", color: 2 }]),
          [EVENTS_KEY]: JSON.stringify([{ id: "e2", name: "Study group" }]),
          "due-theme": "pastel",
          "due-plan-v1": "{}",
        };
        const merged = mergeSyncedData(account, local);
        assertEqual(JSON.parse(merged["due-tasks-v1"]).map((task) => task.name), ["Account copy", "Only in account", "Only here"]);
        assertEqual(JSON.parse(merged["due-groups-v1"]).map((group) => group.id), ["school", "gym"]);
        assertEqual(JSON.parse(merged[EVENTS_KEY]).map((event) => event.name), ["Club", "Study group"]);
        assertEqual(merged["due-theme"], "dark");
        assertEqual(merged["due-plan-v1"], "{}");
      });

      test("saved Google events sync to the account, and the newer copy wins", () => {
        assertEqual(SYNCED_KEYS.includes(GOOGLE_SAVED_KEY), true);
        const older = JSON.stringify({ updatedAt: 1000, start: "2026-11-01", end: "2026-12-01", entries: [{ id: "a:2026-11-20", name: "Old" }] });
        const newer = JSON.stringify({ updatedAt: 2000, start: "2026-11-01", end: "2026-12-01", entries: [{ id: "a:2026-11-20", name: "New" }] });
        assertEqual(mergeSyncedData({ [GOOGLE_SAVED_KEY]: older }, { [GOOGLE_SAVED_KEY]: newer })[GOOGLE_SAVED_KEY], newer);
        assertEqual(mergeSyncedData({ [GOOGLE_SAVED_KEY]: newer }, { [GOOGLE_SAVED_KEY]: older })[GOOGLE_SAVED_KEY], newer);
        assertEqual(mergeSyncedData({}, { [GOOGLE_SAVED_KEY]: older })[GOOGLE_SAVED_KEY], older);
        assertEqual(mergeSyncedData({ [GOOGLE_SAVED_KEY]: "not json" }, { [GOOGLE_SAVED_KEY]: older })[GOOGLE_SAVED_KEY], older);
      });

      test("the Update button says how fresh Google events are, and reminds after a day", () => {
        const now = new Date("2026-11-21T17:00").getTime();
        const ago = (minutes) => now - minutes * 60_000;
        assertEqual(describeGoogleUpdate(ago(0), now), { text: "Updated just now", stale: false });
        assertEqual(describeGoogleUpdate(ago(5), now), { text: "Updated 5 min ago", stale: false });
        assertEqual(describeGoogleUpdate(ago(61), now), { text: "Updated 1 hr ago", stale: false });
        assertEqual(describeGoogleUpdate(ago(23 * 60 + 59), now), { text: "Updated 23 hr ago", stale: false });
        assertEqual(describeGoogleUpdate(ago(24 * 60), now), { text: "Updated 1 day ago", stale: true });
        assertEqual(describeGoogleUpdate(ago(3 * 24 * 60), now), { text: "Updated 3 days ago", stale: true });
      });

      test("Google Calendar events land on the right days at local times", () => {
        const local = (text) => new Date(text).toISOString();
        const lecture = { id: "m", summary: "MATH 220", start: { dateTime: local("2026-11-09T10:00") }, end: { dateTime: local("2026-11-09T10:50") } };
        assertEqual(googleEventDays(lecture, "#039be5"), [
          { id: "m:2026-11-09", sourceId: "", name: "MATH 220", date: "2026-11-09", start: "10:00", end: "10:50", color: "#039be5" },
        ]);
        const trip = { id: "t", summary: "Trip", start: { date: "2026-11-13" }, end: { date: "2026-11-15" } };
        assertEqual(googleEventDays(trip).map((day) => [day.date, day.start]), [["2026-11-13", ""], ["2026-11-14", ""]]);
        const lateNight = { id: "n", start: { dateTime: local("2026-11-09T22:00") }, end: { dateTime: local("2026-11-10T01:00") } };
        assertEqual(googleEventDays(lateNight).map((day) => [day.name, day.date, day.start, day.end]), [
          ["(No title)", "2026-11-09", "22:00", "23:59"],
          ["(No title)", "2026-11-10", "00:00", "01:00"],
        ]);
        const conference = { id: "c", summary: "Conference", start: { dateTime: local("2026-11-09T18:00") }, end: { dateTime: local("2026-11-11T12:00") } };
        assertEqual(googleEventDays(conference).map((day) => [day.date, day.start, day.end]), [
          ["2026-11-09", "18:00", "23:59"],
          ["2026-11-10", "", ""],
          ["2026-11-11", "00:00", "12:00"],
        ]);
        const toMidnight = { id: "z", summary: "Study", start: { dateTime: local("2026-11-09T21:00") }, end: { dateTime: local("2026-11-10T00:00") } };
        assertEqual(googleEventDays(toMidnight).length, 1);
        assertEqual(googleEventDays({ ...lecture, status: "cancelled" }), []);
        assertEqual(googleEventDays({ ...lecture, attendees: [{ self: true, responseStatus: "declined" }] }), []);
      });

      test("free time is the gaps between events, 8 AM to 10 PM, with 10 minutes around each", () => {
        const entry = (start, end) => ({ start, end });
        const day = [entry("09:00", "09:50"), entry("10:00", "10:50"), entry("15:00", "18:00"), entry("15:30", "16:50"), entry("20:00", "22:00")];
        const windows = freeWindows(day);
        assertEqual(describeFreeWindows(windows), "8am-8:50am, 11am-2:50pm, 6:10pm-7:50pm");
        assertEqual(parseFreeTime(describeFreeWindows(windows), 0).windows, windows);
        assertEqual(describeFreeWindows(freeWindows(day, 13 * 60 + 7)), "1:10pm-2:50pm, 6:10pm-7:50pm");
        assertEqual(describeFreeWindows(freeWindows([])), "8am-10pm");
        assertEqual(freeWindows([entry("07:00", "23:00")]), []);
      });

      test("free time can be limited to a time of day or exact times", () => {
        const entry = (start, end) => ({ start, end });
        const day = [entry("09:00", "09:50"), entry("10:00", "10:50"), entry("15:00", "18:00"), entry("20:00", "22:00")];
        const between = (startHour, endHour) => describeFreeWindows(freeWindows(day, 0, { start: startHour * 60, end: endHour * 60 }));
        assertEqual(between(8, 12), "8am-8:50am, 11am-12pm");
        assertEqual(between(12, 17), "12pm-2:50pm");
        assertEqual(between(17, 22), "6:10pm-7:50pm");
        assertEqual(between(21, 23.5), "10:10pm-11:30pm");
        assertEqual(freeWindows(day, 0, { start: 11 * 60 + 50, end: 12 * 60 + 10 }), []);
      });

      test("planning stops at how much you want to work", () => {
        const task = (id, estimateMinutes) => ({ id, name: id, due: "2026-11-10", time: "", done: false, estimateMinutes });
        const tasks = [task("essay", 90), task("problem set", 60), task("reading", 30)];
        const plan = planDay(tasks, [{ start: 9 * 60, end: 21 * 60 }], { todayKey: "2026-11-10", nowMinutes: 9 * 60, maxMinutes: 120 });
        assertEqual(plan.blocks.map((block) => [block.taskId, block.end - block.start]), [["essay", 90], ["problem set", 30]]);
        assertEqual(plan.unscheduled.map((item) => item.taskId), ["reading"]);
      });

      test("sign-in problems are explained in plain words", () => {
        assertEqual(authErrorMessage("auth/invalid-credential"), "That username or password isn't right. Try again, or use Forgot password.");
        assertEqual(authErrorMessage("due/username-taken"), "That username is taken. Try another one.");
        assertEqual(authErrorMessage("auth/email-already-in-use"), "There's already an account with that email. Sign in instead.");
        assertEqual(authErrorMessage("auth/network-request-failed"), "Couldn't reach Due Next. Check your internet and try again.");
        assertEqual(authErrorMessage("auth/something-new"), "Something went wrong. Try again in a moment.");
      });

      const results = document.getElementById("results");
      let failures = 0;
      for (const { name, body } of tests) {
        const item = document.createElement("li");
        try {
          body();
          item.className = "pass";
          item.textContent = `✓ ${name}`;
        } catch (error) {
          failures++;
          item.className = "fail";
          item.textContent = `✗ ${name}: ${error.message}`;
        }
        results.append(item);
      }
      const summary = document.getElementById("summary");
      summary.textContent = failures
        ? `${failures} of ${tests.length} tests failed.`
        : `All ${tests.length} tests passed.`;
      summary.className = failures ? "fail" : "pass";
    </script>
